[package]
name = "alpha"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/caniko/binstall-release-fixture"

[[bin]]
name = "alpha"
path = "src/main.rs"

[[bin]]
name = "alpha-extra"
path = "src/extra.rs"

[[bin]]
name = "alpha-gated"
path = "src/gated.rs"
required-features = ["gated"]

[features]
gated = []

# Stale on purpose: mkBinstallRelease must flag it as a mismatch.
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "https://example.invalid/old-alpha.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
