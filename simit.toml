[ci]
runtime = "nix"
runner = "atlas-nix-trusted"
workspace = true
step_runners = { cargo-clippy = "atlas-nix-trusted", cargo-doc = "atlas-nix-trusted", cargo-fmt = "atlas-nix-trusted", cargo-package = "atlas-nix-trusted", cargo-test = "atlas-nix-trusted", nix-check = "atlas-nix-trusted", quality-tools = "atlas-nix-trusted" }
publish_crates = true
platform = "forgejo"

[ci.pages]
repo = "caniko/rs-harbor"
canonical_domain = "rs-harbor.tartanoglu.com"

[release.codeberg]
repo = "caniko/rs-harbor"
target_branch = "trunk"
token_secret = "CODEBERG_TOKEN"

[release.artifacts]
runner = "atlas-nix-trusted"
substituters = ["https://attic.candee.baby/canix", "https://cache.nixos.org"]
nix_bundle_attrs = ["release-bundle"]
trusted_public_keys = [
  "canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8=",
  "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=",
]
version_attr = "rs-harbor"
build_commands = []
checksum_globs = ["*.tar.gz"]
minisign_pub = "keys/minisign.pub"
sign = true
