[ci]
runtime = "nix"
runner = "ubuntu-24.04"
workspace = true
workspace_strategy = "aggregate"
check_command = "harbor-ci default"
publish_crates = true
platform = "github"
provider = "actions"
all_features = false

[ci.pages]
repo = "caniko/rs-harbor"
canonical_domain = "rs-harbor.tartanoglu.com"
site_output = "./site#site"
deploy_app = "./site#deploy-pages"

[release.github]
repo = "caniko/rs-harbor"
target_branch = "trunk"

[release.changelog]
auto_draft = true

[release.artifacts]
runner = "ubuntu-24.04"
substituters = ["https://attic.candee.baby/canix", "https://cache.nixos.org"]
nix_bundle_attrs = ["release-bundle"]
trusted_public_keys = [
  "canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8=",
  "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=",
]
version_attr = "rs-harbor"
build_commands = []
checksum_globs = ["*.tar.gz"]
minisign_pub = "keys/minisign.pub"
sign = true
